<div class="{% if field.name == 'notes' or field.name == 'note' or field.name == 'invoice' or field.name == 'bill' %}col-12{% else %}col-md-6{% endif %}{% if field.name == 'amount' %} money-primary-amount{% endif %}" data-money-field="{{ field.name }}"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <small class="fw-normal">(optional)</small>{% endif %}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}</div>

{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h4 class="mb-0">Notifications</h4><a class="btn btn-sm btn-outline-light" href="?mark_all=1">Mark all read</a></div>
<ul class="list-group">
{% for n in notifications %}
<li class="list-group-item {% if not n.is_read %}border-warning{% endif %}">
  <div class="d-flex justify-content-between"><strong>{{ n.title }}</strong><small>{{ n.created_at }}</small></div>
  <div>{{ n.message }}</div>
  <small>Level: {{ n.level }}</small>
</li>
{% empty %}
<li class="list-group-item">No notifications</li>
{% endfor %}
</ul>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="card form-card p-3">
  <h5 class="mb-3">{{ title }}</h5>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Save</button>
    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}

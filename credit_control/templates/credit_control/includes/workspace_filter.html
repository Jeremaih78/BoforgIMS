<form class="money-card money-filter mb-3" method="get"><div><label class="form-label" for="credit-currency">Currency</label><select id="credit-currency" class="form-select" name="currency">{% for code in currency_codes %}<option {% if code == currency %}selected{% endif %}>{{ code }}</option>{% endfor %}</select></div><div><label class="form-label" for="credit-date">Balance at</label><input id="credit-date" name="as_of" type="date" class="form-control" value="{{ as_of|date:'Y-m-d' }}"></div>{% if side %}<div class="money-search"><label class="form-label" for="credit-q">Search</label><input id="credit-q" name="q" type="search" class="form-control" value="{{ q }}" placeholder="Name, phone or document number"></div><div class="form-check py-2"><input id="credit-overdue" name="overdue" value="1" type="checkbox" class="form-check-input" {% if overdue_only %}checked{% endif %}><label class="form-check-label" for="credit-overdue">Overdue only</label></div>{% endif %}<button class="btn btn-primary" type="submit">Apply</button></form>

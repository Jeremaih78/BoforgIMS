<nav class="tasker-mobile-nav" aria-label="Quick navigation">
  <a href="{% url 'ims:tasker:index' %}"{% if tasker_current_section == 'now' %} aria-current="page"{% endif %}><i class="bi bi-sun" aria-hidden="true"></i><span>Now</span></a>
  <a href="{% url 'ims:tasker:capture_list' %}"{% if tasker_current_section == 'inbox' %} aria-current="page"{% endif %}><i class="bi bi-inbox" aria-hidden="true"></i><span>Inbox</span></a>

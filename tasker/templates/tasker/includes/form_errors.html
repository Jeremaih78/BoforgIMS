{% if form.errors %}<div class="tasker-error-summary alert alert-danger" role="alert" tabindex="-1" data-tasker-error-summary><h2 class="h6">Your changes have not been saved</h2>{{ form.non_field_errors }}<ul class="mb-0">{% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.id_for_label|default:field.auto_id }}">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}</ul></div>{% endif %}

{% if page_obj.has_other_pages %}<nav class="coordination-actions" aria-label="Pages">{% if page_obj.has_previous %}<a class="btn btn-secondary" href="?page={{ page_obj.previous_page_number }}{% if state %}&state={{ state|urlencode }}{% endif %}{% if report_date %}&report_date={{ report_date|date:'Y-m-d' }}{% endif %}">Previous</a>{% endif %}<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="btn btn-secondary" href="?page={{ page_obj.next_page_number }}{% if state %}&state={{ state|urlencode }}{% endif %}{% if report_date %}&report_date={{ report_date|date:'Y-m-d' }}{% endif %}">Next</a>{% endif %}</nav>{% endif %}

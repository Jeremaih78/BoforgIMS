<fieldset class="strategy-change-row" data-strategy-change-row><legend>Task change <span data-strategy-row-number>{{ forloop.counter }}</span></legend>{{ row.non_field_errors }}<div class="strategy-change-fields">{% for field in row.visible_fields %}{% if field.name != 'DELETE' %}<div><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{{ field.errors }}</div>{% endif %}{% endfor %}</div><div class="form-check mt-3">{{ row.DELETE }}<label class="form-check-label" for="{{ row.DELETE.id_for_label }}">Exclude this change from the preview</label></div></fieldset>
